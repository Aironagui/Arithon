
name: Build Arithon APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p build-project
          unzip -q Arithon_Android_Project.zip -d build-project
          echo "Project files:"
          find build-project -maxdepth 4 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

      - name: Build debug APK
        shell: bash
        run: |
          PROJECT_FILE="$(find build-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Check the contents of Arithon_Android_Project.zip."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: Gradle wrapper (gradlew) not found."
            echo "The Android project needs a Gradle wrapper or a compatible Gradle installation."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arithon-APK
          path: build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
