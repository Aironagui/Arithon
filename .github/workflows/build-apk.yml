
name: Build Arithon APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          find "$SDK/cmdline-tools" -type f -name sdkmanager -print || true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q Arithon_Android_Project.zip -d build-project

             
      - name: Prepare Arithon launcher logo
        shell: bash
        run: |
          set -e
          python3 -m pip install --quiet Pillow
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image, ImageOps

          logo_path = Path("arithon_logo.jpeg")
          if not logo_path.is_file():
              raise SystemExit("Logo not found in repository root.")

          manifests = list(Path("build-project").rglob("AndroidManifest.xml"))
          matches = [
              p for p in manifests
              if p.parent.name == "main"
              and (p.parent / "res").is_dir()
          ]

          if not matches:
              raise SystemExit("Android main/res folder not found.")

          manifest = matches[0]
          res = manifest.parent / "res"
          print("Android resources:", res)

          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          root = ET.parse(manifest).getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("Android application element not found.")

          icon_ref = app.get("{" + ns + "}icon", "@mipmap/ic_launcher")
          icon_name = icon_ref.split("/")[-1]
          logo = Image.open(logo_path).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = res / ("mipmap-" + density)
              if not folder.is_dir():
                  continue

              canvas = Image.new("RGBA", (size, size), "#166534")
              fitted = ImageOps.contain(
                  logo, (int(size * 0.76), int(size * 0.76))
              )
              canvas.alpha_composite(
                  fitted,
                  ((size - fitted.width) // 2,
                   (size - fitted.height) // 2)
              )

              for ext in (".png", ".webp", ".jpg", ".jpeg"):
                  old = folder / (icon_name + ext)
                  if old.exists():
                      old.unlink()

              canvas.save(folder / (icon_name + ".png"))
              print("Created:", folder / (icon_name + ".png"))

          print("Launcher icon preparation complete.")
          PY
          

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          PROJECT_FILE="$(find build-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find build-project -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arithon-APK
          path: build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
