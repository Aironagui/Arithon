
name: Build Arithon APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          find "$SDK/cmdline-tools" -type f -name sdkmanager -print || true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q Arithon_Android_Project.zip -d build-project

      - name: Prepare Arithon launcher logo
        shell: bash
        run: |
          set -e
          python3 -m pip install --quiet Pillow
          python3 <<'PY'
          import os, glob, zipfile
          from PIL import Image, ImageOps

          logo_path = "arithon_logo.jpeg"
          if not os.path.isfile(logo_path):
              raise SystemExit("Logo not found in repository root.")

          projects = glob.glob("build-project/**/settings.gradle*", recursive=True)
          if not projects:
              raise SystemExit("Android project not found in ZIP.")

          project_dir = os.path.dirname(projects[0])
          res = os.path.join(project_dir, "app", "src", "main", "res")
          if not os.path.isdir(res):
              raise SystemExit("Android res folder not found: " + res)

          manifest = os.path.join(project_dir, "app", "src", "main",
                                  "AndroidManifest.xml")
          if not os.path.isfile(manifest):
              raise SystemExit("AndroidManifest.xml not found.")

          import xml.etree.ElementTree as ET
          root = ET.parse(manifest).getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          icon_ref = root.find("application").get(ns + "icon", "@mipmap/ic_launcher")
          name = icon_ref.split("/")[-1]

          logo = Image.open(logo_path).convert("RGBA")
          bg = (22, 101, 52, 255)

          # Create legacy launcher PNGs for supported densities.
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96,
                   "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = os.path.join(res, "mipmap-" + density)
              if os.path.isdir(folder):
                  canvas = Image.new("RGBA", (size, size), bg)
                  fitted = ImageOps.contain(logo, (int(size*.78), int(size*.78)))
                  canvas.alpha_composite(fitted, ((size-fitted.width)//2,
                                                   (size-fitted.height)//2))
                  canvas.convert("RGB").save(os.path.join(folder, name + ".png"))

          # Create adaptive-icon foreground and XML where Android 8+ uses it.
          anydpi = os.path.join(res, "mipmap-anydpi-v26")
          if os.path.isdir(anydpi):
              fgdir = os.path.join(res, "drawable")
              os.makedirs(fgdir, exist_ok=True)
              size = 432
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              fitted = ImageOps.contain(logo, (int(size*.55), int(size*.55)))
              canvas.alpha_composite(fitted, ((size-fitted.width)//2,
                                               (size-fitted.height)//2))
              canvas.save(os.path.join(fgdir, name + "_foreground.png"))

              colors = os.path.join(res, "values", "colors.xml")
              os.makedirs(os.path.dirname(colors), exist_ok=True)
              if os.path.exists(colors):
                  tree = ET.parse(colors)
                  values = tree.getroot()
              else:
                  values = ET.Element("resources")
                  tree = ET.ElementTree(values)
              for item in list(values):
                  if item.get("name") == "arithon_icon_background":
                      values.remove(item)
              ET.SubElement(values, "color",
                            {"name": "arithon_icon_background"}).text = "#166534"
              tree.write(colors, encoding="utf-8", xml_declaration=True)

              for filename in (name + ".xml", name + "_round.xml"):
                  path = os.path.join(anydpi, filename)
                  if os.path.exists(path):
                      xml = ET.Element("adaptive-icon", {
                          "xmlns:android": "http://schemas.android.com/apk/res/android"})
                      ET.SubElement(xml, "background", {
                          "{http://schemas.android.com/apk/res/android}drawable":
                          "@color/arithon_icon_background"})
                      ET.SubElement(xml, "foreground", {
                          "{http://schemas.android.com/apk/res/android}drawable":
                          "@drawable/" + name + "_foreground"})
                      ET.ElementTree(xml).write(
                          path, encoding="utf-8", xml_declaration=True)

          print("Launcher logo resources prepared.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          PROJECT_FILE="$(find build-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find build-project -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arithon-APK
          path: build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
