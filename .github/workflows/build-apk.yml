
name: Build Arithon APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          find "$SDK/cmdline-tools" -type f -name sdkmanager -print || true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q Arithon_Android_Project.zip -d build-project

          
      - name: Inspect Android icon resources
        shell: bash
        run: |
          echo "=== Android manifest ==="
          find build-project -name AndroidManifest.xml -print

          echo "=== Resource directories ==="
          find build-project -type d -name res -print

          echo "=== Launcher icon files ==="
          find build-project -type f \( \
            -iname '*launcher*' -o \
            -iname '*ic_logo*' -o \
            -iname '*icon*' \
          \) -print | head -100

          echo "=== Project Gradle files ==="
          find build-project -type f \( \
            -name build.gradle -o \
            -name build.gradle.kts \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          PROJECT_FILE="$(find build-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find build-project -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arithon-APK
          path: build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
