
name: Build Arithon APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q Arithon_Android_Project.zip -d build-project
          find build-project -name settings.gradle -o -name settings.gradle.kts

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find build-project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/Arithon-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arithon-APK
          path: apk-output/Arithon-debug.apk
          if-no-files-found: error
